name: Deploy Godot Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          GODOT_CHANNEL="stable"
          GODOT_RELEASE="${GODOT_VERSION}-${GODOT_CHANNEL}"
          GODOT_ARCHIVE="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          TEMPLATE_ARCHIVE="Godot_v${GODOT_RELEASE}_export_templates.tpz"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"

          mkdir -p "$HOME/.local/bin" "$TEMPLATE_DIR"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/${GODOT_ARCHIVE}" \
            --output "/tmp/${GODOT_ARCHIVE}"
          unzip -q "/tmp/${GODOT_ARCHIVE}" -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/${TEMPLATE_ARCHIVE}" \
            --output "/tmp/${TEMPLATE_ARCHIVE}"
          unzip -q -j "/tmp/${TEMPLATE_ARCHIVE}" \
            'templates/web*.zip' \
            'templates/icudt_godot.dat' \
            'templates/version.txt' \
            -d "$TEMPLATE_DIR"

      - name: Verify public player template contains no saved placements
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("player_layout.json").read_text(encoding="utf-8"))
          assert data.get("objects", []) == [], "public template contains saved objects"
          assert data.get("light_strings", []) == [], "public template contains saved light strings"
          assert data.get("deleted_ids", []) == [], "public template contains deleted object ids"
          assert data.get("player_night", False) is False, "public template contains saved night state"
          PY

      - name: Import and export the Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release Web "$PWD/build/index.html"
          touch build/.nojekyll
          du -sh build
          find build -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
